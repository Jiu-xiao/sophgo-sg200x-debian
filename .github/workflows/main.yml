name: Build Docker Image
on:
  push:
    tags:
      - '*'
    branches:
      - '*'
  workflow_dispatch:
  
jobs:
  build-docker-image:
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.image-repo.outputs.value }}
    steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: Compute lower-case image repo
          id: image-repo
          run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sophgo-sg200x-debian" >> "$GITHUB_OUTPUT"
        - uses: dorny/paths-filter@v3
          id: filter
          with:
            filters: |
              src:
              - 'scripts/**'
        - name: Log into registry ghcr.io
          if: (github.event_name != 'pull_request' && steps.filter.outputs.src == 'true') || startsWith(github.event.ref, 'refs/tags/v')
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extract Docker metadata
          if: (github.event_name != 'pull_request' && steps.filter.outputs.src == 'true') || startsWith(github.event.ref, 'refs/tags/v')
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ steps.image-repo.outputs.value }}

        - name: Build and push Docker image
          if: (github.event_name != 'pull_request' && steps.filter.outputs.src == 'true') || startsWith(github.event.ref, 'refs/tags/v')
          id: build-and-push
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./scripts/Dockerfile
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
        - name: pause
          if: (github.event_name != 'pull_request' && steps.filter.outputs.src == 'true') || startsWith(github.event.ref, 'refs/tags/v')
          run: sleep 120
          
  build-image:
    strategy:
      fail-fast: false
      matrix:
        boards: [licheervnano, duo256, duos]
        storage: [sd]
        include: 
          - boards: duos
            storage: emmc
    runs-on: ubuntu-latest
    needs: build-docker-image
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Get Board Configs
        uses: actions/checkout@v4
      - name: Build Images
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ needs.build-docker-image.outputs.image_repo }}:${{ github.ref_name }}
          options: --privileged -v ${{ github.workspace }}/images/:/output -v ${{ github.workspace }}/configs/:/configs/
          run: |
            set -eux
            make BOARD=${{ matrix.boards }} STORAGE_TYPE=${{ matrix.storage }} image
            test -d /output
            chmod 777 /output/
      - name: Pack
        run: |
          set -euo pipefail
          cd images/
          ls -lah
          image=${{ matrix.boards }}_${{ matrix.storage }}.img
          test -s "$image"
          lz4 -9 -f "$image" "$image.lz4"
          rm "$image"
          test -s "$image.lz4"
          shopt -s nullglob
          debs=(*.deb)
          if ((${#debs[@]})); then
              tar czvf ${{ matrix.boards }}-${{ matrix.storage }}_debs.tar.gz "${debs[@]}"
              rm -- "${debs[@]}"
          fi
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: image-files-${{ matrix.boards }}-${{ matrix.storage }}
          path: ${{ github.workspace }}/images/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions: write-all
    steps:
      - name: download firmware
        uses: actions/download-artifact@v4
      - name: list images
        run: |
          ls -lah
          ls -lah image-files-*/
      - name: publish artifacts
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          files: |
            image-files-*/*
