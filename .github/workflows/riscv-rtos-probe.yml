name: Build C906L communication stack

on:
  push:
    branches:
      - codex-rtos-mailbox-fix-20260731
    paths:
      - .github/workflows/riscv-rtos-probe.yml
      - configs/common/patches/linux/**
      - configs/common/patches/osdrv/**
      - configs/licheervnano/**
      - scripts/Makefile
      - scripts/addons/rtos-firmware/**
      - scripts/build_rtos_only.sh
      - scripts/check_rtos_trace_layout.py
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: c906l-communication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-communication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDER_IMAGE: ghcr.io/jiu-xiao/sophgo-sg200x-debian:codex-usbnet-ssh-unattended-20260730
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel, communication tools, and standalone RTOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-output
          docker pull "$BUILDER_IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/scripts:/builder:ro" \
            -v "$GITHUB_WORKSPACE/configs:/configs:ro" \
            -v "$GITHUB_WORKSPACE/probe-output:/output" \
            "$BUILDER_IMAGE" \
            bash -lc '
              set -euo pipefail
              mkdir -p /rootfs
              make BOARD=licheervnano STORAGE_TYPE=sd linux /build//rtos-firmware-stamp
              CC=cc bash /builder/addons/rtos-firmware/tests/run_host_tests.sh \
                /build/rtos-firmware-sdk/cvi_mpi/include /output/host-tests
              make BOARD=licheervnano STORAGE_TYPE=sd osdrv-clean
              make BOARD=licheervnano STORAGE_TYPE=sd osdrv
              cd /
              OUT_DIR=/output/standalone \
                SDK_DIR=/build/rtos-firmware-sdk \
                BUILD_HOST_TOOLS=/host-tools \
                ADDON_ROOT=/builder/addons/rtos-firmware \
                bash /builder/build_rtos_only.sh
            '

      - name: Package probe artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact extracted osdrv-extracted
          mapfile -t image_debs < <(find probe-output -maxdepth 1 -type f -name 'linux-image-licheervnano-*.deb' -print)
          test "${#image_debs[@]}" -eq 1
          mapfile -t osdrv_debs < <(find probe-output -maxdepth 1 -type f -name 'cvitek-osdrv-licheervnano-*.deb' -print)
          test "${#osdrv_debs[@]}" -eq 1
          dpkg-deb -x "${image_debs[0]}" extracted
          dpkg-deb -x "${osdrv_debs[0]}" osdrv-extracted
          mapfile -t modules < <(find extracted -type f -name cvitek_remoteproc.ko -print)
          test "${#modules[@]}" -eq 1
          mapfile -t cmdqu_modules < <(find osdrv-extracted -type f -name cv181x_rtos_cmdqu.ko -print)
          test "${#cmdqu_modules[@]}" -eq 1
          cp "${image_debs[0]}" artifact/
          cp "${osdrv_debs[0]}" artifact/
          cp "${modules[0]}" artifact/cvitek_remoteproc.ko
          cp "${cmdqu_modules[0]}" artifact/cv181x_rtos_cmdqu.ko
          cp probe-output/licheervnano_c906-mcu.elf artifact/
          cp probe-output/licheervnano_c906-mcu.bin artifact/
          cp probe-output/licheervnano_rtos-cmd artifact/rtos-cmd
          cp probe-output/licheervnano_rtos-bench artifact/rtos-bench
          cp probe-output/licheervnano_libsg2002-rtos.a artifact/libsg2002-rtos.a
          cp probe-output/sg2002_rtos.h artifact/
          cp probe-output/sg2002_rtos_protocol.h artifact/
          cp probe-output/licheervnano_boot-trace-layout.json artifact/
          cp probe-output/licheervnano_rtos-sdk-commit.txt artifact/rtos-sdk-commit.txt
          cp probe-output/host-tests/host-tests.txt artifact/
          cp probe-output/standalone/licheervnano_c906-mcu.elf artifact/standalone-c906-mcu.elf
          cp probe-output/standalone/licheervnano_c906-mcu.bin artifact/standalone-c906-mcu.bin
          cp probe-output/standalone/licheervnano_boot-trace-layout.json artifact/standalone-boot-trace-layout.json
          cp probe-output/standalone/licheervnano_rtos-source-SHA256SUMS.txt artifact/standalone-source-SHA256SUMS.txt
          modinfo -F vermagic artifact/cvitek_remoteproc.ko > artifact/vermagic.txt
          modinfo -F vermagic artifact/cv181x_rtos_cmdqu.ko > artifact/cmdqu-vermagic.txt
          strings -a artifact/cvitek_remoteproc.ko > artifact/cvitek_remoteproc.strings.txt
          strings -a artifact/cv181x_rtos_cmdqu.ko > artifact/cv181x_rtos_cmdqu.strings.txt
          strings -a artifact/licheervnano_c906-mcu.elf > artifact/c906l-rtos.strings.txt
          grep -Fqx 'firmware has no resource table; using mailbox-only mode' artifact/cvitek_remoteproc.strings.txt
          grep -Fqx 'failed to %s C906L via SBI: %d' artifact/cvitek_remoteproc.strings.txt
          grep -Fqx 'boot trace host sentinel at 0x%llx' artifact/cvitek_remoteproc.strings.txt
          grep -Fqx 'boot_trace' artifact/cvitek_remoteproc.strings.txt
          grep -Fqx 'reply_posted' artifact/cvitek_remoteproc.strings.txt
          grep -Fqx 'mailbox_poll' artifact/cvitek_remoteproc.strings.txt
          grep -Fqx 'prvCmdQuRunTask run; c906l_mailbox_layered_v1' artifact/c906l-rtos.strings.txt
          grep -Fqx 'protocol=PASS' artifact/host-tests.txt
          grep -Fqx 'rtos_app=PASS' artifact/host-tests.txt
          grep -Fqx 'linux_comm=PASS' artifact/host-tests.txt
          test -x artifact/rtos-cmd
          test -x artifact/rtos-bench
          printf '%s\n' "${GITHUB_SHA}" > artifact/source-commit.txt
          (
            cd artifact
            sha256sum \
              "$(basename "${image_debs[0]}")" \
              "$(basename "${osdrv_debs[0]}")" \
              cvitek_remoteproc.ko \
              cv181x_rtos_cmdqu.ko \
              licheervnano_c906-mcu.elf \
              licheervnano_c906-mcu.bin \
              standalone-c906-mcu.elf \
              standalone-c906-mcu.bin \
              standalone-boot-trace-layout.json \
              standalone-source-SHA256SUMS.txt \
              rtos-cmd \
              rtos-bench \
              libsg2002-rtos.a \
              sg2002_rtos.h \
              sg2002_rtos_protocol.h \
              host-tests.txt \
              licheervnano_boot-trace-layout.json \
              rtos-sdk-commit.txt \
              source-commit.txt \
              vermagic.txt \
              cmdqu-vermagic.txt \
              cvitek_remoteproc.strings.txt \
              cv181x_rtos_cmdqu.strings.txt \
              c906l-rtos.strings.txt > SHA256SUMS.txt
          )

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: c906l-communication-stack
          path: artifact/
          if-no-files-found: error
          retention-days: 7
