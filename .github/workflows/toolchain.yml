name: Build toolchain

on:
  push:
    paths:
      - .dockerignore
      - scripts/Dockerfile
      - toolchain.env
      - scripts/ci/toolchain-ref.sh
      - .github/workflows/toolchain.yml
  pull_request:
    paths:
      - .dockerignore
      - scripts/Dockerfile
      - toolchain.env
      - scripts/ci/toolchain-ref.sh
      - .github/workflows/toolchain.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable toolchain inputs
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source toolchain.env
          set +a
          image=$(bash scripts/ci/toolchain-ref.sh "$GITHUB_REPOSITORY_OWNER")
          {
            echo "image=$image"
            echo "base=$BUILDER_BASE_IMAGE"
            echo "snapshot=$DEBIAN_SNAPSHOT"
            echo "host_tools_repo=$HOST_TOOLS_REPO"
            echo "host_tools_commit=$HOST_TOOLS_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Build and optionally publish toolchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.vars.outputs.image }}
          build-args: |
            BUILDER_BASE_IMAGE=${{ steps.vars.outputs.base }}
            DEBIAN_SNAPSHOT=${{ steps.vars.outputs.snapshot }}
            HOST_TOOLS_REPO=${{ steps.vars.outputs.host_tools_repo }}
            HOST_TOOLS_COMMIT=${{ steps.vars.outputs.host_tools_commit }}
          cache-from: type=gha,scope=sg2002-toolchain
          cache-to: type=gha,mode=max,scope=sg2002-toolchain
